<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="groic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="groic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#groic-grad)" stroke-width="2.5" opacity="0.4" />
  <!-- Dynamic Sound Prism / Equalizer Waves forming 'G' -->
  <path d="M 34 24 C 34 29.52 29.52 34 24 34 C 18.48 34 14 29.52 14 24 C 14 18.48 18.48 14 24 14 C 28.5 14 32.2 16.9 33.4 21 L 24 21" 
        stroke="url(#groic-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Center Energy Pulse -->
  <circle cx="24" cy="24" r="3.5" fill="#f97316" filter="url(#groic-glow)" />
</svg>
